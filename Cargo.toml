[package]
name = "axum-health"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
futures = "0.3.32"
libc = "0.2.186"
moka = { version = "0.12.15", features = ["future"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1.2"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = "0.26.4"
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"

[dev-dependencies]
tower = "0.5.3"
