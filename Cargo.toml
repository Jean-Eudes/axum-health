[package]
name = "axum-health"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
futures = "0.3.31"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = "0.26.4"

[dev-dependencies]
tower = "0.5.3"
